name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Unit tests
        run: python3 -m unittest discover tests -v

      - name: Structure checker smoke test
        run: python3 tests/check_structure.py tests/fixtures/structure.md tests/fixtures/structure.md

      # skills-ref requires the directory name to match `name` in SKILL.md,
      # but the checkout directory is named after the repository.
      - name: Validate SKILL.md against the Agent Skills spec
        run: |
          pip install "git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"
          mkdir -p "$RUNNER_TEMP/humanizer-zh"
          cp -r SKILL.md references "$RUNNER_TEMP/humanizer-zh/"
          skills-ref validate "$RUNNER_TEMP/humanizer-zh"
